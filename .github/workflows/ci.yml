name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke
      - run: npm run package
      - uses: actions/upload-artifact@v7
        with:
          name: sidenote-x-extension
          path: dist/*.zip
          if-no-files-found: error
